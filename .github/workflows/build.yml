name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-13,       target: x86_64-apple-darwin }   # Intel
          - { os: macos-14,       target: aarch64-apple-darwin }  # Apple Silicon
          - { os: ubuntu-22.04,   target: x86_64-unknown-linux-gnu }

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm deps
        run: npm ci

      - name: Install ffmpeg sidecar
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          case "${{ matrix.target }}" in
            x86_64-pc-windows-msvc)
              curl -L https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip -o ffmpeg.zip
              unzip -j ffmpeg.zip "**/ffmpeg.exe" -d src-tauri/binaries/
              mv src-tauri/binaries/ffmpeg.exe src-tauri/binaries/ffmpeg-${{ matrix.target }}.exe
              ;;
            *-apple-darwin)
              curl -L https://www.osxexperts.net/ffmpeg7arm.zip -o ffmpeg.zip || \
              curl -L https://evermeet.cx/ffmpeg/getrelease/ffmpeg/zip -o ffmpeg.zip
              unzip -j ffmpeg.zip ffmpeg -d src-tauri/binaries/
              mv src-tauri/binaries/ffmpeg src-tauri/binaries/ffmpeg-${{ matrix.target }}
              chmod +x src-tauri/binaries/ffmpeg-${{ matrix.target }}
              ;;
            x86_64-unknown-linux-gnu)
              curl -L https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-linux64-gpl.tar.xz -o ffmpeg.tar.xz
              tar -xJf ffmpeg.tar.xz --wildcards "*/bin/ffmpeg" --strip-components=2
              mv ffmpeg src-tauri/binaries/ffmpeg-${{ matrix.target }}
              chmod +x src-tauri/binaries/ffmpeg-${{ matrix.target }}
              ;;
          esac

      - name: Build Python sidecar
        shell: bash
        working-directory: python-sidecar
        run: |
          python -m pip install --upgrade pip wheel
          pip install -e ".[dev]"
          python build.py --target ${{ matrix.target }} --clean

      - name: Build Tauri app
        run: npm run tauri:build

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: stem-splitter-${{ matrix.target }}
          path: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: ignore
