[project]
name = "stem-splitter"
version = "0.1.0"
description = "Sidecar Python que baixa do YouTube e separa em 6 stems via Demucs"
requires-python = ">=3.10,<3.14"
authors = [{ name = "you" }]
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "yt-dlp>=2024.10.7",
    "demucs>=4.0.1",
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    "pydantic>=2.5",
    "soundfile>=0.12.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pyinstaller>=6.10",
    "ruff>=0.6",
]

[project.scripts]
stem-splitter-sidecar = "stem_splitter.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["stem_splitter*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
